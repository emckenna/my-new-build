<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPU Options — Whisper Beast 2026</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <a href="index.html">← Back to build dashboard</a>
    <h1>GPU Options</h1>
    <p class="subtitle">Choose a local preview, or persist the selection globally through GitHub Actions.</p>
    <div id="gpu-status" class="gpu-status" role="status"></div>
    <div class="gpu-table-scroll">
      <table class="gpu-table">
        <caption class="sr-only">Tracked GPU options</caption>
        <thead>
          <tr>
            <th scope="col">GPU</th>
            <th scope="col">Price</th>
            <th scope="col">Build total</th>
            <th scope="col">GPU ID</th>
            <th scope="col">Retailers</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="gpu-table-body"></tbody>
      </table>
    </div>
  </main>

  <script>
    const fmt = n => n != null
      ? '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })
      : '—';
    const GPU_WORKFLOW_URL = 'https://github.com/emckenna/my-new-build/actions/workflows/set-gpu.yml';

    async function loadJSON(path) {
      const response = await fetch(path + '?t=' + Date.now());
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    function selectedId() {
      try {
        return localStorage.getItem('selected_gpu_id');
      } catch {
        return null;
      }
    }

    function setStatus(message) {
      document.getElementById('gpu-status').textContent = message;
    }

    function previewGpu(id, name) {
      try {
        localStorage.setItem('selected_gpu_id', id);
        document.querySelectorAll('.gpu-row').forEach(row => {
          row.classList.toggle('selected', row.dataset.id === id);
        });
        setStatus(`${name} selected for this browser. Return to the dashboard to see the local preview.`);
      } catch {
        setStatus('This browser blocked local storage, so the preview could not be saved.');
      }
    }

    function copyGpuId(id, button) {
      navigator.clipboard.writeText(id).then(() => {
        button.textContent = 'Copied';
        setTimeout(() => { button.textContent = 'Copy ID'; }, 1200);
      }).catch(() => {
        setStatus(`Copy failed. GPU ID: ${id}`);
      });
    }

    function persistGpu(id, name) {
      const copyPromise = navigator.clipboard?.writeText(id);
      copyPromise?.catch(() => {});
      window.open(GPU_WORKFLOW_URL, '_blank', 'noopener');
      setStatus(`GPU ID copied. In Actions, click Run workflow and paste: ${id}`);
    }

    async function main() {
      const tableBody = document.getElementById('gpu-table-body');
      try {
        const [parts, prices] = await Promise.all([loadJSON('parts.json'), loadJSON('prices.json')]);
        const gpuParts = parts.parts.filter(part => part.category === 'video card');
        const priceMap = prices.parts ?? {};
        const baseTotal = parts.parts
          .filter(part => part.in_build !== false && part.category !== 'video card')
          .reduce((sum, part) => sum + (priceMap[part.id]?.lowest_price ?? 0), 0)
          + parts.extras.reduce((sum, extra) => sum + extra.fixed_price, 0);
        const currentId = selectedId();

        tableBody.innerHTML = gpuParts.map(part => {
          const price = priceMap[part.id]?.lowest_price ?? null;
          const total = price == null ? null : baseTotal + price;
          const selected = part.id === currentId;
          return `
            <tr class="gpu-row${selected ? ' selected' : ''}" data-id="${part.id}">
              <th scope="row">
                <strong>${part.name}</strong>
                <span class="gpu-description">${part.description}</span>
                ${selected ? '<span class="gpu-selected">Preview selected</span>' : ''}
              </th>
              <td class="gpu-price">${fmt(price)}</td>
              <td class="gpu-meta">${total != null ? fmt(total) : 'Pending'}</td>
              <td class="gpu-id"><code>${part.id}</code> <button type="button" class="copy-id">Copy</button></td>
              <td class="gpu-links">
                ${Object.entries(part.retailers ?? {}).filter(([, url]) => url)
                  .map(([retailer, url]) => `<a href="${url}" target="_blank" rel="noopener">${retailer}</a>`).join(' · ')}
              </td>
              <td>
                <div class="gpu-actions">
                  <button type="button" class="preview-btn">Preview</button>
                  <button type="button" class="persist-btn">Persist</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        gpuParts.forEach(part => {
          const row = tableBody.querySelector(`[data-id="${part.id}"]`);
          row.querySelector('.copy-id').addEventListener('click', event => copyGpuId(part.id, event.currentTarget));
          row.querySelector('.preview-btn').addEventListener('click', () => previewGpu(part.id, part.name));
          row.querySelector('.persist-btn').addEventListener('click', () => persistGpu(part.id, part.name));
        });
      } catch (error) {
        setStatus('Error loading GPU data: ' + error.message);
      }
    }

    main();
  </script>
</body>
</html>
